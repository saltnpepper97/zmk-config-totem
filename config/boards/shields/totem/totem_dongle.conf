# You have 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Fetch battery % from peripherals
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Proxy those battery levels to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# A USB-powered XIAO dongle has no battery. Do not expose Zephyr's local BAS,
# which otherwise appears to hosts as a permanent, misleading 100% battery.
# The independent split peripheral proxy above remains enabled.
CONFIG_BT_BAS=n

# Use the strongest supported nRF52840 transmit power for the split links.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SLEEP=n
