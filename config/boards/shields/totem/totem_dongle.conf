# You have 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Fetch battery % from peripherals
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Proxy those battery levels to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Keep the standard BAS implementation available internally. In this pinned
# ZMK revision, disabling it prevents the central battery path from producing
# telemetry after reboot. The USB tray ignores this local dongle service and
# consumes only the two explicitly tagged peripheral sources.
CONFIG_BT_BAS=y

# Use the strongest supported nRF52840 transmit power for the split links.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SLEEP=n
